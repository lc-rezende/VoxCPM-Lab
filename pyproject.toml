[project]
name = "lab-voxcpm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas Rezende", email = "lucas.c.rezende@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
lab-voxcpm = "lab_voxcpm:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
